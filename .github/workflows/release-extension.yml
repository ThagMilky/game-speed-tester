name: Release extension

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Package extension
        id: package
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import zipfile
          from pathlib import Path

          root = Path(".")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          version = manifest["version"]
          tag = f"v{version}"

          if not re.fullmatch(r"v[0-9]+(?:\.[0-9]+){2,3}", tag):
              raise SystemExit(f"Invalid version in manifest.json: {version}")
          if os.environ["GITHUB_REF"].startswith("refs/tags/") and os.environ["GITHUB_REF_NAME"] != tag:
              raise SystemExit("Git tag must match manifest.json version.")
          if os.environ["GITHUB_REF"].startswith("refs/heads/") and os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Branch releases must run from main.")
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" and os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Manual releases must run from main.")

          allowed_dirs = {"core", "features", "shared", "ui", "uncategorized"}
          files = [root / "manifest.json"] + sorted(
              path for path in root.rglob("*")
              if path.is_file()
              and path.suffix in {".js", ".css", ".html"}
              and (path.parent == root or path.parts[0] in allowed_dirs)
          )
          included = {path.as_posix() for path in files}
          required = {"manifest.json", manifest["action"]["default_popup"]}
          for content_script in manifest.get("content_scripts", []):
              required.update(content_script.get("js", []))
              required.update(content_script.get("css", []))
          for resources in manifest.get("web_accessible_resources", []):
              required.update(resources.get("resources", []))
          popup_html = (root / manifest["action"]["default_popup"]).read_text(encoding="utf-8")
          required.update(re.findall(r'(?:src|href)="([^"]+\.(?:js|css))"', popup_html))
          missing = required - included
          if missing:
              raise SystemExit(f"Missing packaged extension files: {sorted(missing)}")

          output = root / "dist" / f"Game-Speed-Tester-{tag}.zip"
          output.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, arcname=f"Game-Speed-Tester/{path.as_posix()}")
              archive.writestr(
                  "Game-Speed-Tester/INSTALL.txt",
                  "Game Speed Tester - Chrome extension\n\n"
                  "1. Extract this ZIP to a permanent folder.\n"
                  "2. Open chrome://extensions in Chrome (111+).\n"
                  "3. Enable Developer mode.\n"
                  "4. Click Load unpacked and select the Game-Speed-Tester folder.\n"
                  "5. Reload the game tab after installation.\n"
                  "\nFor updates, replace files in the SAME folder and click Reload "
                  "on the extension page to preserve its path-based identity.\n",
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              outputs.write(f"tag={tag}\n")
              outputs.write(f"archive={output}\n")
          PY

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" \
              --verify-tag --title "Game Speed Tester $RELEASE_TAG" --generate-notes
          else
            existing_tag_commit="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
            if [[ -n "$existing_tag_commit" && "$existing_tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG already points to a different commit." >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" \
              --target "$GITHUB_SHA" --title "Game Speed Tester $RELEASE_TAG" --generate-notes
          fi
